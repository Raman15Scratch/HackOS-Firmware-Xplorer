<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HackOS Firmware Xplorer v0.1 Alpha!</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <header class="menu-bar">

            <div class="menu-container">

                <button class="menu-button" id="fileButton">
                    File
                </button>

                <div class="dropdown" id="fileMenu">

                    <button id="openButton">
                        Open
                    </button>

                    <button id="exitButton">
                        Exit
                    </button>

                </div>

            </div>


            <div class="menu-container">

                <button class="menu-button" id="helpButton">
                    Help
                </button>

                <div class="dropdown" id="helpMenu">

                    <button id="aboutButton">
                        About
                    </button>

                </div>

            </div>

        </header>


        <main class="workspace">

            <h1>
                Welcome to HackOS Firmware Xplorer v0.1 Alpha!
            </h1>

            <p>
                Soon this window will display firmware<br>
                and binary files in hexadecimal.
            </p>

        </main>


        <footer class="status-bar">
            Ready
        </footer>

    </div>


    <div class="dialog-overlay" id="aboutDialog">

        <div class="dialog">

            <button class="dialog-close" id="aboutX">
                ×
            </button>

            <h2>
                About
            </h2>

            <p>
                <strong>HackOS Firmware Xplorer</strong>
            </p>

            <p>
                Version 0.1 Alpha Build 1
            </p>

            <button class="about-ok" id="aboutClose">
                OK
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
